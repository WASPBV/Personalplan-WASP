function evBar(WK){if(!evSel||!evSel.items.length)return '';const it=evSel.items,one=it.length===1?it[0]:null,ad_=evSel.ad,md=evSel.md,pers=it.filter(x=>!isVeh(x.e));

  let h=`<div class="evbar2"><div class="evb1"><b>${it.length>1?it.length+' gewählt':''}</b><span class="evsl">${it.map(x=>`<span class="evchip">${lbl(x)}<button data-evun="${esc(x.e)}|${x.i}" title="abwählen">×</button></span>`).join('')}</span><button class="evx" data-evx="1">✕ Auswahl leeren</button></div>`;
  const opts=[...colOrd(ORD()).slice().sort((a,b)=>ORD().indexOf(a)-ORD().indexOf(b)),...S.machines.map((_,i)=>i).filter(isLag)].map(i=>`<option value="${i}"${evSel.to===i?' selected':''}>${esc(S.machines[i])}</option>`).join('');
  h+=`<div class="evb1"><span class="evbl">Verschieben nach:</span><select data-evto="1"><option value="">– Ziel wählen –</option>${opts}<option value="-1"${evSel.to===-1?' selected':''}>${pers.length?'Reserve':'frei (Fahrzeuge)'}</option></select>
    <span class="evbl" style="min-width:0">Tage:</span>${DAYS.map((x,d)=>WK.includes(d)?`<button class="evd${md.includes(d)?' on':''}" data-evmd="${d}">${x}</button>`:'').join('')}<button class="evd${md.length===WK.length?' on':''}" data-evwk="1">Ganze Woche</button><button class="evgo" data-evgo="1"${evSel.to===undefined||evSel.to===null?' disabled':''}>Verschieben</button><button data-evres="1">${pers.length?'→ Reserve':'→ frei'}</button>
    <span class="evhint">${md.length?'':'ohne Tage = ihre bisherigen Tage · oder Ziel-Karte antippen'}</span></div>`;
  if(one&&one.i>=0){const on=evOn(one.e,one.i,WK);h+=`<div class="evb1"><span class="evbl">Auf ${esc(S.machines[one.i])} an:</span>${DAYS.map((x,d)=>WK.includes(d)?`<button class="evd${on.includes(d)?' on':''}" data-evtog="${d}">${x}</button>`:'').join('')}</div>`;
    if(!isVeh(one.e))h+=`<div class="evb1"><span class="evbl">💬 Kommentar:</span><input class="evcmi" data-evcm="1" maxlength="60" value="${esc((S.cmt||{})[cmK(one.i,one.e)]||'')}" placeholder="z. B. 4. Mann / 06.00 Uhr"><button data-evcmsave="1">Speichern</button>${(S.cmt||{})[cmK(one.i,one.e)]?'<button data-evcmdel="1">Löschen</button>':''}</div>`}
  if(pers.length)h+=`<div class="evb1"><span class="evbl">Abwesend am:</span>${DAYS.map((x,d)=>WK.includes(d)?`<button class="evd${ad_.includes(d)?' on':''}" data-evad="${d}">${x} ${dm(ad(S.wk,d))}</button>`:'').join('')}${[['U','Urlaub'],['KO','Frei'],['K','Krank'],['UF','Unfall']].map(([c,l])=>`<button class="evab" data-evabs="${c}" style="background:${CM[c][3]};color:${CM[c][4]};border-color:${CM[c][3]}"${ad_.length?'':' disabled'}>${l}</button>`).join('')}</div>`;
  if(one&&isVeh(one.e))h+=`<div class="evb1"><button data-evvws="1">🔧 Fahrzeug in die Werkstatt</button></div>`;
  return h+'</div>'}
function evRm(e,d){P(d).forEach(m=>{const x=m.indexOf(e);if(x>=0)m.splice(x,1)})}
function evMoveMany(items,to,md){const {WK}=evDays(),used=evUsed();let out=[],bad=[];snap();
  items.forEach(({e,i:from})=>{const veh=isVeh(e);let tt=to;if(veh&&tt===-1)tt=-3;if(!veh&&tt===-3)tt=-1;if(from===tt&&!(md&&md.length))return;
    if(!veh&&tt>=0&&S.func[e]==='Chauffeur'&&!drvOk(e,tt)){bad.push(evNm(e)+' (nicht berechtigt)');return}
    const days=md&&md.length?md.filter(d=>WK.includes(d)):(from<0?evFree(e,WK,used):WK.filter(d=>P(d)[from].includes(e)));const ok=[],ab=[];
    days.forEach(d=>{if(tt>=0&&!veh&&code(e,d)){ab.push(DAYS[d]);return}if(tt>=0&&veh&&wsv(d).includes(e)){ab.push(DAYS[d]);return}
      if(md&&md.length&&from>=0&&tt<0){const m=P(d)[from],x=m.indexOf(e);if(x>=0)m.splice(x,1)}else evRm(e,d);
      if(tt>=0&&!P(d)[tt].includes(e))P(d)[tt].push(e);ok.push(d)});
    out.push(evNm(e)+(ok.length?(ok.length===WK.length?'':' '+ok.map(d=>DAYS[d]).join(' ')):' –')+(ab.length?' (abwesend '+ab.join(' ')+')':''))});
  const tn=to>=0?S.machines[to]:(items.every(x=>isVeh(x.e))?'frei':'Reserve');
  msg=(out.length?out.join(', ')+' → '+tn:'Nichts verschoben')+(bad.length?' · nicht möglich: '+bad.join(', '):'');
  evSel=null;evFill=null;save();render()}
function evMove(e,from,to){evMoveMany([{e,i:from}],to,[])}
function evToggle(e,i,d,keepSel){const m=P(d)[i];snap();if(m.includes(e)){m.splice(m.indexOf(e),1);msg=evNm(e)+': '+DAYS[d]+' entfernt'}else{if(!isVeh(e)&&code(e,d)){msg=evNm(e)+' ist am '+DAYS[d]+' abwesend.';render();return}evRm(e,d);m.push(e);msg=evNm(e)+': '+DAYS[d]+' auf '+S.machines[i]}
  if(!keepSel)evSel=null;else{evSel.items=evSel.items.filter(x=>x.e!==e||x.i===i)}save();render()}
function evAbs(c){if(!evSel||!evSel.ad.length)return;const ps=evSel.items.filter(x=>!isVeh(x.e)).map(x=>x.e);snap();
  ps.forEach(e=>evSel.ad.forEach(d=>{const ds=ad(S.wk,d),k=e+'|'+ds;(S.cal[e]=S.cal[e]||{})[ds]=c;evRm(e,d);delete S.noko[k];delete S.auto[k]}));
  msg=ps.map(evNm).join(', ')+': '+CM[c][2]+' am '+evSel.ad.map(d=>DAYS[d]).join(' ')+' eingetragen';evSel=null;save();render()}
function evAbsEdit(e){const {WK}=evDays();const d=WK.find(d=>cd(e,ad(S.wk,d)))??WK.find(d=>partOf(e,ad(S.wk,d)));if(d===undefined){msg='Keine Abwesenheit diese Woche.';render();return}
  const ds=ad(S.wk,d),c=cd(e,ds);evSel=null;serOpen('f',e,ds);if(c&&ser)ser.c0=c}
function evCm(i,e,v){v=String(v||'').trim();S.cmt=S.cmt||{};const k=cmK(i,e);if(v)S.cmt[k]=v;else delete S.cmt[k];msg=evNm(e)+': Kommentar '+(v?'gespeichert':'gelöscht');evSel=null;save();render()}
document.addEventListener('keydown',ev=>{const t=ev.target;if(ev.key==='Enter'&&t.dataset&&t.dataset.evcm&&evSel){ev.preventDefault();const x=evSel.items[0];evCm(x.i,x.e,t.value)}},true);
function evPick(e){if(!evFill)return;const {i,days,j}=evFill,used=evUsed();snap();let ok=[];days.forEach(d=>{if(code(e,d)||P(d)[i].includes(e))return;if(used[d].has(e)){if(j!=='D')return;evRm(e,d)}const m=P(d)[i];if(j==='D'){const k=m.findIndex(x=>!isVeh(x));if(k<0)m.push(e);else m.splice(k,0,e)}else m.push(e);ok.push(DAYS[d])});
  msg=e.split(' ')[0]+' → '+S.machines[i]+' ('+ok.join(' ')+')';evFill=null;save();render()}
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.evto&&evSel){evSel.to=t.value===''?null:+t.value;render()}},true);
document.addEventListener('click',ev=>{if(tab!=='plan'||vw!=='card')return;const t=ev.target;if(!t.closest)return;
  if(t.closest('[data-wsp],[data-mwsp],[data-vwsp]'))return;
  const bar=t.closest('.evbar2');
  if(bar){ev.stopPropagation();const b=t.closest('button');if(!b||!evSel)return;const {WK}=evDays();
    if(b.dataset.evx){evSel=null;render();return}
    if(b.dataset.evun){const k=b.dataset.evun.lastIndexOf('|'),e=b.dataset.evun.slice(0,k),i=+b.dataset.evun.slice(k+1);evSel.items=evSel.items.filter(x=>!(x.e===e&&x.i===i));if(!evSel.items.length)evSel=null;render();return}
    if(b.dataset.evtog!==undefined){const x=evSel.items[0];evToggle(x.e,x.i,+b.dataset.evtog,1);return}
    if(b.dataset.evmd!==undefined){const d=+b.dataset.evmd,a=evSel.md,x=a.indexOf(d);if(x>=0)a.splice(x,1);else a.push(d);a.sort();render();return}
    if(b.dataset.evwk){evSel.md=evSel.md.length===WK.length?[]:WK.slice();render();return}
    if(b.dataset.evcmsave||b.dataset.evcmdel){const x=evSel.items[0],inp=bar.querySelector('[data-evcm]');evCm(x.i,x.e,b.dataset.evcmdel?'':(inp?inp.value:''));return}
    if(b.dataset.evres){evMoveMany(evSel.items,-1,evSel.md);return}
    if(b.dataset.evgo){if(evSel.to===null||evSel.to===undefined)return;evMoveMany(evSel.items,evSel.to,evSel.md);return}
    if(b.dataset.evad!==undefined){const d=+b.dataset.evad,a=evSel.ad,x=a.indexOf(d);if(x>=0)a.splice(x,1);else a.push(d);a.sort();render();return}
    if(b.dataset.evabs){evAbs(b.dataset.evabs);return}
    if(b.dataset.evvws){const v=evSel.items[0].e;evSel=null;render();vwsPop(v);return}
    return}
  if(!t.closest('.evpg'))return;
  const abn=t.closest('[data-evabsn]');if(abn){ev.stopPropagation();evAbsEdit(abn.dataset.evabsn);return}
  const pick=t.closest('[data-evpick]');if(pick){ev.stopPropagation();evPick(pick.dataset.evpick);return}
  const tg=t.closest('[data-evt]'),row=t.closest('[data-eve]'),card=t.closest('[data-evc]'),f=t.closest('[data-evf]');
  if(tg&&row&&+row.dataset.evi>=0&&!evSel){ev.stopPropagation();evToggle(row.dataset.eve,+row.dataset.evi,+tg.dataset.evt);return}
  if(row){ev.stopPropagation();const e=row.dataset.eve,i=+row.dataset.evi;if(!evSel)evSel={items:[],ad:[],md:[],to:null};
    if(evIn(e,i))evSel.items=evSel.items.filter(x=>!(x.e===e&&x.i===i));else evSel.items.push({e,i});if(!evSel.items.length)evSel=null;evFill=null;msg='';render();if(t.closest('.evcm')){const f=document.querySelector('[data-evcm]');if(f)f.focus()}return}
  if(f&&!evSel){ev.stopPropagation();const [i,j,ds]=f.dataset.evf.split('|');evFill=evFill&&evFill.i===+i&&evFill.j===j?null:{i:+i,j,days:ds.split(',').map(Number)};render();return}
  if(card&&evSel){ev.stopPropagation();evMoveMany(evSel.items,+card.dataset.evc,evSel.md);return}
},true);
document.addEventListener('dragstart',ev=>{const r=ev.target.closest&&ev.target.closest('.evpg [data-eve]');if(!r)return;ev.stopPropagation();try{ev.dataTransfer.setData('text/plain',r.dataset.eve);ev.dataTransfer.effectAllowed='move'}catch(e){}
  const e=r.dataset.eve,i=+r.dataset.evi;if(!evIn(e,i))evSel={items:[{e,i}],ad:[],md:[],to:null,drag:1};else evSel.drag=1;r.classList.add('drg')},true);
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('.evpg [data-evc]');if(!c)return;ev.preventDefault();ev.stopPropagation();document.querySelectorAll('.evc.tgt').forEach(x=>{if(x!==c)x.classList.remove('tgt')});c.classList.add('tgt')},true);
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('.evpg [data-evc]');if(!c||!evSel)return;ev.preventDefault();ev.stopPropagation();evMoveMany(evSel.items,+c.dataset.evc,evSel.md)},true);
document.addEventListener('dragend',ev=>{if(ev.target.closest&&ev.target.closest('.evpg')){document.querySelectorAll('.evc.tgt,.drg').forEach(x=>x.classList.remove('tgt','drg'));if(evSel&&evSel.drag){evSel=null;render()}}},true);
// ---- Seitenmenü rechts + auf-/zuklappbare Zeilen ----
let flyOpen=false;try{flyOpen=localStorage.getItem('pp_menu')==='1'}catch(e){}let COL={};try{COL=JSON.parse(localStorage.getItem('pp_col')||'{}')||{}}catch(e){COL={}}
const colSave=()=>{try{localStorage.setItem('pp_col',JSON.stringify(COL))}catch(e){}};
const wide=()=>{try{return window.matchMedia('(min-width:1100px)').matches}catch(e){return false}};
function decor(){
  const a=document.getElementById('app');if(!a)return;
  // Menü rechts
  const mi=[...a.children].filter(x=>x.matches('.navw,.tb'));
  if(mi.length){const f=document.createElement('div');f.className='mnu'+(flyOpen?' on':'');mi.forEach(x=>f.appendChild(x));
    const b=document.createElement('button');b.className='mtg'+(flyOpen?' on':'');b.setAttribute('data-fab','1');b.innerHTML=flyOpen?'▴ Menü':'☰ Menü';
    a.insertBefore(f,a.firstChild);a.insertBefore(b,f.nextSibling);a.classList.add('flym')}
  // Zeilen / Abschnitte klappen
  const tb=a.querySelector('table.wk tbody');if(!tb)return;let sec='',hide=false;
  [...tb.rows].forEach(tr=>{const th=tr.querySelector('th');if(!th)return;
    if(tr.classList.contains('sec')){sec=th.textContent.trim();hide=!!COL['s:'+sec];th.setAttribute('data-sec',sec);th.insertAdjacentHTML('afterbegin','<span class="tgi">'+(hide?'▸':'▾')+'</span> ');tr.classList.toggle('scol',hide);return}
    if(hide){tr.style.display='none';return}
    const k='r:'+(th.firstChild&&th.firstChild.textContent||th.textContent).trim().slice(0,40);
    th.insertAdjacentHTML('afterbegin','<button class="rtg" data-rtg="'+k.replace(/"/g,'&quot;')+'" title="Zeile auf-/zuklappen">'+(COL[k]?'▸':'▾')+'</button>');
    if(COL[k])tr.classList.add('rc')});
}
document.addEventListener('click',ev=>{const t=ev.target;if(t.closest&&t.closest('[data-fab]')){ev.stopPropagation();ev.preventDefault();flyOpen=!flyOpen;try{localStorage.setItem('pp_menu',flyOpen?'1':'0')}catch(e){}const f=document.querySelector('#app .mnu');if(f)f.classList.toggle('on',flyOpen);const b=t.closest('[data-fab]');b.classList.toggle('on',flyOpen);b.innerHTML=flyOpen?'▴ Menü':'☰ Menü';return}
  const s=t.closest&&t.closest('[data-sec]'),r=t.closest&&t.closest('[data-rtg]');
  if(r){ev.stopPropagation();ev.preventDefault();const k=r.dataset.rtg;if(COL[k])delete COL[k];else COL[k]=1;colSave();render();return}
  if(s){ev.stopPropagation();ev.preventDefault();const k='s:'+s.dataset.sec;if(COL[k])delete COL[k];else COL[k]=1;colSave();render()}},true);
let cm=isC();try{window.addEventListener('resize',()=>{const c=isC();if(c!==cm){cm=c;render()}})}catch(e){}
render();
psShow();
psInit();
</script>
